<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bizzu – Legal</title>
  <meta name="description" content="Documentos legais do aplicativo Bizzu." />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #F8FAFC;
      color: #1E293B;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: #fff;
      border: 1px solid #E2E8F0;
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 24px rgba(124,98,255,0.08);
    }
    .logo {
      display: inline-block;
      background: linear-gradient(135deg, #7C62FF, #5B39E6);
      color: #fff;
      font-size: 28px;
      font-weight: 900;
      border-radius: 16px;
      width: 64px;
      height: 64px;
      line-height: 64px;
      margin-bottom: 20px;
    }
    h1 { font-size: 22px; font-weight: 800; color: #1E293B; margin-bottom: 8px; }
    p { font-size: 14px; color: #64748B; margin-bottom: 28px; line-height: 1.6; }
    .links { display: flex; flex-direction: column; gap: 12px; }
    a.btn {
      display: block;
      padding: 14px 20px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 15px;
      text-decoration: none;
      transition: opacity 0.15s;
    }
    a.btn:hover { opacity: 0.85; }
    .btn-primary { background: linear-gradient(135deg, #7C62FF, #5B39E6); color: #fff; }
    .btn-outline { border: 2px solid #7C62FF; color: #5B39E6; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">B</div>
    <h1>Bizzu</h1>
    <p>Documentos legais do aplicativo Bizzu.</p>
    <div class="links">
      <a class="btn btn-primary" href="privacy-policy.html">Política de Privacidade</a>
      <a class="btn btn-outline" href="terms-of-use.html">Termos de Uso</a>
    </div>
  </div>
</body>
</html>
